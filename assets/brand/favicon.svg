<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="OctoTechnology">
  <!-- Тимчасовий логотип-восьминіг (поки не готовий 3D-логотип). Окуляри — як у кота Марка. -->
  <defs>
    <radialGradient id="oHead" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#c3b8fb"/>
      <stop offset=".45" stop-color="#8f7fe3"/>
      <stop offset="1" stop-color="#5d4bc0"/>
    </radialGradient>
    <linearGradient id="oArm" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#a596f0"/>
      <stop offset="1" stop-color="#6b59cc"/>
    </linearGradient>
    <radialGradient id="oShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2d2466" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2d2466" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oLens" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eae6fb" stop-opacity=".85"/>
    </radialGradient>
  </defs>

  <ellipse cx="104" cy="186" rx="70" ry="9" fill="url(#oShadow)"/>

  <!-- щупальця: темний контур + заливка градієнтом -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#3f3196" stroke-width="21">
      <path d="M60 110 C30 128 22 158 40 169 C52 176 61 164 51 157"/>
      <path d="M77 124 C62 150 58 172 75 180 C86 184 90 171 81 167"/>
      <path d="M94 130 C90 154 92 174 106 181"/>
      <path d="M123 124 C138 150 142 172 125 180 C114 184 110 171 119 167"/>
      <path d="M140 110 C170 128 178 158 160 169 C148 176 139 164 149 157"/>
    </g>
    <g stroke="url(#oArm)" stroke-width="14">
      <path d="M60 110 C30 128 22 158 40 169 C52 176 61 164 51 157"/>
      <path d="M77 124 C62 150 58 172 75 180 C86 184 90 171 81 167"/>
      <path d="M94 130 C90 154 92 174 106 181"/>
      <path d="M123 124 C138 150 142 172 125 180 C114 184 110 171 119 167"/>
      <path d="M140 110 C170 128 178 158 160 169 C148 176 139 164 149 157"/>
    </g>
    <!-- присоски -->
    <g fill="#d9d2fb" stroke="none" opacity=".9">
      <circle cx="33" cy="150" r="2.6"/><circle cx="39" cy="162" r="2.4"/>
      <circle cx="64" cy="160" r="2.6"/><circle cx="70" cy="172" r="2.4"/>
      <circle cx="94" cy="160" r="2.4"/>
      <circle cx="136" cy="160" r="2.6"/><circle cx="130" cy="172" r="2.4"/>
      <circle cx="167" cy="150" r="2.6"/><circle cx="161" cy="162" r="2.4"/>
    </g>
  </g>

  <!-- голова -->
  <path d="M100 18 C146 18 166 52 164 86 C162 118 136 136 100 136 C64 136 38 118 36 86 C34 52 54 18 100 18 Z"
        fill="url(#oHead)" stroke="#3f3196" stroke-width="4"/>
  <!-- крапинки -->
  <g fill="#ffffff" opacity=".22">
    <circle cx="128" cy="40" r="6"/><circle cx="143" cy="58" r="4"/><circle cx="118" cy="30" r="3"/>
  </g>
  <!-- глянець -->
  <ellipse cx="74" cy="44" rx="22" ry="12" fill="#ffffff" opacity=".45" transform="rotate(-24 74 44)"/>

  <!-- рум'янець -->
  <ellipse cx="58" cy="106" rx="11" ry="7" fill="#ff9fb5" opacity=".7"/>
  <ellipse cx="142" cy="106" rx="11" ry="7" fill="#ff9fb5" opacity=".7"/>

  <!-- очі в круглих окулярах -->
  <circle cx="77" cy="86" r="17" fill="url(#oLens)"/>
  <circle cx="123" cy="86" r="17" fill="url(#oLens)"/>
  <circle cx="79" cy="88" r="8" fill="#2a2147"/>
  <circle cx="125" cy="88" r="8" fill="#2a2147"/>
  <circle cx="82" cy="84.5" r="3" fill="#fff"/>
  <circle cx="128" cy="84.5" r="3" fill="#fff"/>
  <g fill="none" stroke="#e08a2e" stroke-width="4">
    <circle cx="77" cy="86" r="17"/>
    <circle cx="123" cy="86" r="17"/>
    <path d="M94 84 Q100 79 106 84" stroke-linecap="round"/>
  </g>

  <!-- усмішка -->
  <path d="M88 112 Q100 123 112 112" fill="none" stroke="#2a2147" stroke-width="4" stroke-linecap="round"/>
  <path d="M95 116 Q100 121 105 116 Z" fill="#ff7a93"/>
</svg>
