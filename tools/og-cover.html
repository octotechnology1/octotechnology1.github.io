<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-cover</title>
<!-- Прев'ю для месенджерів (1200×630). Оновити: python tools/render_og.py -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Nunito", "Segoe UI", sans-serif; color: #2d3a4d; position: relative;
    background: linear-gradient(180deg, #a9d3e9 0%, #cfe3ef 45%, #dde6ec 100%);
  }
  .cloud { position: absolute; background: rgba(255,255,255,.6); border-radius: 100px; }
  .c1 { width: 260px; height: 64px; top: 70px; left: 640px; } .c2 { width: 180px; height: 48px; top: 470px; left: 60px; }
  .glow { position: absolute; left: 30px; top: 70px; width: 470px; height: 470px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(234,230,251,.6) 45%, rgba(234,230,251,0) 70%); }
  .octo { position: absolute; left: 70px; top: 95px; width: 390px; filter: drop-shadow(0 20px 26px rgba(61,49,150,.28)); }
  .text { position: absolute; left: 500px; top: 150px; width: 660px; }
  .badge { display: inline-block; background: #eae6fb; color: #7c6bd6; font-weight: 800; font-size: 24px; padding: 8px 20px; border-radius: 999px; }
  h1 { font-size: 84px; font-weight: 900; letter-spacing: -2px; line-height: 1.05; margin: 18px 0 12px; }
  h1 em { font-style: normal; color: #7c6bd6; }
  p { font-size: 32px; font-weight: 800; color: #52627a; }
  .icons { display: flex; gap: 18px; margin-top: 34px; }
  .icons img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 10px 22px rgba(45,58,77,.22), 0 0 0 4px #fff; }
  .mark { position: absolute; right: 26px; bottom: -6px; width: 150px; filter: drop-shadow(0 10px 14px rgba(45,74,105,.28)); }
</style>
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="glow"></div>
  <img class="octo" src="../assets/brand/octo.svg" alt="">
  <div class="text">
    <span class="badge">🐙 Kids' app studio</span>
    <h1>Octo<em>Technology</em></h1>
    <p>Kind apps for children aged 2–7</p>
    <div class="icons">
      <img src="../apps/twomeows/media/icon.webp" alt="">
      <img src="../apps/marks-garage/media/icon.webp" alt="">
      <img src="../apps/mark-the-cat/media/icon.webp" alt="">
      <img src="../apps/marks-art/media/icon.webp" alt="">
      <img src="../apps/marks-home/media/icon.webp" alt="">
    </div>
  </div>
</body>
</html>
